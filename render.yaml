# Render Blueprint — ONE web service (backend serves the built frontend).
# Same setup as the other projects: a single URL, no CORS/URL juggling.
# After the first deploy, run the seed once from the service Shell:
#   npm run seed
services:
  - type: web
    name: campaign-management
    runtime: node
    buildCommand: npm install --prefix backend && npm install --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SETTINGS_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: SEND_DELAY_MS
        value: "250"
      - key: MAX_CONCURRENT_CAMPAIGNS
        value: "2"
      - key: MAX_SEND_RETRIES
        value: "2"
      - key: RETRY_BACKOFF_MS
        value: "3000"
      - key: SCHEDULER_INTERVAL_MS
        value: "30000"
