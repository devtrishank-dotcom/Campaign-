# Render Blueprint — deploy backend (Web Service) + frontend (Static Site)
# After the first deploy, run the seed once from the backend Shell:
#   npm run seed
services:
  - type: web
    name: campaign-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SEND_DELAY_MS
        value: "250"
      - key: MAX_CONCURRENT_CAMPAIGNS
        value: "2"
      - key: MAX_SEND_RETRIES
        value: "2"
      - key: RETRY_BACKOFF_MS
        value: "3000"
      - key: SCHEDULER_INTERVAL_MS
        value: "30000"

  - type: web
    name: campaign-admin
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
